{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-pencil"></i> Edit Placement Drive</h1>
    <a href="{{ url_for('company_drives') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back to Drives
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Edit Drive Details</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="job_title" class="form-label">Job Title</label>
                        <input type="text" class="form-control" id="job_title" name="job_title" 
                               value="{{ drive.job_title }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Job Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" required>{{ drive.description }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="eligibility_criteria" class="form-label">Eligibility Criteria</label>
                        <textarea class="form-control" id="eligibility_criteria" name="eligibility_criteria" rows="3" required>{{ drive.eligibility_criteria }}</textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="min_cgpa" class="form-label">Minimum CGPA</label>
                            <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                   id="min_cgpa" name="min_cgpa" value="{{ drive.min_cgpa if drive.min_cgpa else '' }}">
                            <small class="text-muted">Leave empty if no minimum required</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="salary_package" class="form-label">Salary Package</label>
                            <input type="text" class="form-control" id="salary_package" name="salary_package" 
                                   value="{{ drive.salary_package }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="deadline" class="form-label">Application Deadline</label>
                        <input type="date" class="form-control" id="deadline" name="deadline" 
                               value="{{ drive.deadline }}" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
